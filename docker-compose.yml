services:
  app:
    build: .
    container_name: web-vid-review
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:3000}"
      AUTO_TAG: "${AUTO_TAG:-true}"
      WEBHOOK_URLS: "${WEBHOOK_URLS:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      RATE_LIMIT_UPLOAD: "${RATE_LIMIT_UPLOAD:-30}"
      RATE_LIMIT_REVIEW: "${RATE_LIMIT_REVIEW:-60}"
      RATE_LIMIT_LOGIN: "${RATE_LIMIT_LOGIN:-10}"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s